<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sistema MRG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior fixa com navegação por módulos; conteúdo em coluna larga; edição em painel lateral (tela cheia no celular). */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#14201D; --muted:#5A6A65; --line:#D3DCD8;
  --accent:#0B6E63; --accent-ink:#FFFFFF; --accent-soft:#D7ECE8; --signal:#C9731F;
  --ok:#2E7D4F; --ok-soft:#DCEFE3; --warn:#A86A12; --warn-soft:#F6EAD3; --bad:#B23A30; --bad-soft:#F6DEDB; --info:#3A5BA8; --info-soft:#DFE6F5;
  --shadow:0 10px 30px rgba(20,32,29,.16);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4ECE8; --muted:#93A39D; --line:#293530;
  --accent:#3DB3A2; --accent-ink:#04201B; --accent-soft:#173A34; --signal:#EE9E4A;
  --ok:#5CC287; --ok-soft:#173326; --warn:#E3AE4F; --warn-soft:#3A2D14; --bad:#EE7A6E; --bad-soft:#3D1E1B; --info:#8EA9EC; --info-soft:#1D2742;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4ECE8; --muted:#93A39D; --line:#293530;
  --accent:#3DB3A2; --accent-ink:#04201B; --accent-soft:#173A34; --signal:#EE9E4A;
  --ok:#5CC287; --ok-soft:#173326; --warn:#E3AE4F; --warn-soft:#3A2D14; --bad:#EE7A6E; --bad-soft:#3D1E1B; --info:#8EA9EC; --info-soft:#1D2742;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.auth{display:grid;place-items:center;min-height:60vh}.auth .card{width:min(420px,100%);padding:24px}
.me .who{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:16ch}
.ini{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.75rem;flex:none}
@media (max-width:560px){.me .who,.me .role{display:none}}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:30px;width:auto;max-width:110px;object-fit:contain}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.8rem}
.brand b{font-family:var(--f-display);font-size:1.05rem;white-space:nowrap}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);min-width:0}
.me img{width:26px;height:26px;border-radius:50%}
.me .role{padding:2px 8px;border-radius:99px;background:var(--surface-2);white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:500;cursor:pointer}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{max-width:1280px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.88rem;border:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card>h3{margin-bottom:12px}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi .v{font-family:var(--f-mono);font-size:1.45rem;font-weight:500;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:2px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input.in,select.in,textarea.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea.in{min-height:76px;resize:vertical}
.search{max-width:320px}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-info{background:var(--info-soft);color:var(--info)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.tag-ex{font-size:.68rem;padding:1px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);margin-left:6px;vertical-align:middle}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}

/* barras com segmentos tipo medidor de nível */
.hb{display:grid;gap:8px}
.hb .r{display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.hb .r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hb .bar i{display:block;height:100%;background:var(--accent);-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.hb .r:first-child .bar i{background:var(--signal)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .bar{fill:var(--accent)} svg .bar.hi{fill:var(--signal)} svg .grid{stroke:var(--line)}
.legend{display:grid;gap:6px;font-size:.86rem}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}

/* funil */
.funnel{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.col .ch{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:grid;gap:4px;text-align:left}
.fc:hover{border-color:var(--accent)}
.fc .t{font-weight:600}
.feed{display:grid;gap:10px}
.feed .it{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.88rem}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}

/* painel lateral de edição */
.ov{position:fixed;inset:0;background:rgba(10,16,14,.42);z-index:40}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:grid;grid-template-rows:auto 1fr auto;box-shadow:var(--shadow)}
.dr-h{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dr-h h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-b{overflow-y:auto;padding:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.dr-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.dr-f .sp{flex:1}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;background:var(--surface);display:grid;gap:12px;min-width:0}
legend{font-family:var(--f-display);font-weight:600;padding:0 6px}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:.78rem;color:var(--muted);font-weight:500}
.f.w2{grid-column:span 2} @media (max-width:520px){.f.w2{grid-column:auto}}
.warn{font-size:.82rem;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(140px,2fr) 70px 110px 110px 32px;gap:6px;align-items:start}
.item .tot{padding:8px 4px;text-align:right}
@media (max-width:700px){.item{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:10px}.item .tot{text-align:left}}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:6px;border-radius:6px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.total-line{display:flex;justify-content:flex-end;gap:14px;font-size:1.05rem;align-items:baseline}
.total-line b{font-family:var(--f-mono);font-size:1.25rem}
.att{display:grid;gap:6px}
.att .a{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.att .a a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{display:grid;gap:10px}
.tl .e{border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.tl .e .m{font-size:.78rem;color:var(--muted)}
.logo-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo-box .pv{width:120px;height:64px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden}
.logo-box .pv img{max-width:100%;max-height:100%;object-fit:contain}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:9px;background:var(--bad-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.map-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(140px,1fr);gap:8px;align-items:center}
.sample{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.dr{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand" id="brand"><span class="mark">MRG</span><b>Sistema MRG</b></div>
    <div class="me" id="me"></div>
  </div>
  <nav class="tabs" id="nav" aria-label="Módulos"></nav>
</header>
<main id="main"></main>
<div id="drawer" hidden>
  <div class="ov" data-act="close"></div>
  <section class="dr" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="dr-h"><h2 id="dTitle"></h2><button class="x" data-act="close" aria-label="Fechar">✕</button></div>
    <div class="dr-b" id="dBody"></div>
    <div class="dr-f" id="dFoot"></div>
  </section>
</div>
<input type="file" id="filePick" hidden>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== Configuração do Supabase: preencha com os dados do seu projeto ===== */
const SUPA_URL='COLE_AQUI_A_PROJECT_URL';
const SUPA_KEY='COLE_AQUI_A_CHAVE_ANON';

/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const num=s=>{if(typeof s==='number')return s;s=String(s??'').replace(/[^\d,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const nowIso=()=>new Date().toISOString();
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const fdate=iso=>iso?iso.slice(0,10).split('-').reverse().join('/'):'';
const fdt=iso=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const ym=iso=>(iso||'').slice(0,7);
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ymLabel=k=>{const[y,m]=k.split('-');return MESES[+m-1]+'/'+y.slice(2)};
const digits=s=>String(s||'').replace(/\D/g,'');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){const ks=p.split('.');let c=o;ks.slice(0,-1).forEach((k,i)=>{if(c[k]==null)c[k]=/^\d+$/.test(ks[i+1])?[]:{};c=c[k]});c[ks.at(-1)]=v}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const REGIAO={AC:'Norte',AP:'Norte',AM:'Norte',PA:'Norte',RO:'Norte',RR:'Norte',TO:'Norte',AL:'Nordeste',BA:'Nordeste',CE:'Nordeste',MA:'Nordeste',PB:'Nordeste',PE:'Nordeste',PI:'Nordeste',RN:'Nordeste',SE:'Nordeste',DF:'Centro-Oeste',GO:'Centro-Oeste',MT:'Centro-Oeste',MS:'Centro-Oeste',ES:'Sudeste',MG:'Sudeste',RJ:'Sudeste',SP:'Sudeste',PR:'Sul',RS:'Sul',SC:'Sul'};

/* ================= estado ================= */
const DEFAULT_CFG={
  nome:'MRG',site:'',telefone:'',email:'',endereco:'',logo:null,corPdf:'#0B6E63',
  emitentes:[{rotulo:'CNPJ 1',razao:'',cnpj:'',ie:'',endereco:'',banco:''},{rotulo:'CNPJ 2',razao:'',cnpj:'',ie:'',endereco:'',banco:''}],
  condicoesPadrao:'50% na aprovação e 50% na entrega.',validadeDias:15,rodape:'Obrigado pela confiança.'
};
const DEFAULT_LISTAS={
  atividadesPJ:['Agência de Publicidade','Produtora de Vídeo','Cliente direto (anunciante)','Emissora de rádio/TV','Outro'],
  atividadesPF:['Locutor','Produtor','Músico','Cliente pessoa física'],
  tiposServico:['Spot comercial','Áudio para VT','Jingle','Locução','Trilha sonora','Podcast','Mixagem e master','Outro'],
  tiposInteracao:['Pedido de alteração','Follow-up','Reunião','Envio de material','Aprovação do cliente','Reclamação','Observação'],
  responsaveis:[],
  categoriasDespesa:['Aluguel','Energia','Internet e telefone','Fornecedor de produção','Impostos','Salários e pró-labore','Software e assinaturas','Outras despesas'],
  categoriasReceita:['Serviços prestados','Outras receitas']
};
const MODULOS=[['painel','Painel'],['crm','CRM'],['cadastros','Cadastros'],['propostas','Propostas'],['os','Ordens de serviço'],['financeiro','Financeiro'],['importar','Importar'],['config','Configurações']];
const ST_PROP=['Apresentada','Aprovada','Não Aprovada','Standby'];
const ST_PROP_CLS={'Apresentada':'p-info','Aprovada':'p-ok','Não Aprovada':'p-bad','Standby':'p-warn'};
const ST_OS=['Aberta','Em Execução','Esperando Faturar','Faturada','Fechada'];
const ST_OS_CLS={'Aberta':'p-info','Em Execução':'p-acc','Esperando Faturar':'p-warn','Faturada':'p-ok','Fechada':''};

const S={view:'painel',cfg:clone(DEFAULT_CFG),listas:clone(DEFAULT_LISTAS),perfis:[],meP:null,cad:[],prop:[],os:[],lanc:[],pag:{},log:[],usuarios:[],
  loaded:{},names:{},me:null,myId:null,isAdmin:false,canWrite:true,f:{}};
let SB=null,DB=null,ASSETS=null,ED=null;

function hbars(rows,fmt=v=>v){if(!rows.length)return`<div class="empty small">Sem dados no período.</div>`;const mx=Math.max(...rows.map(r=>r.v),1);
  return`<div class="hb">${rows.map(r=>`<div class="r"><span title="${esc(r.label)}">${esc(r.label)}</span><div class="bar"><i style="width:${Math.max(2,r.v/mx*100)}%"></i></div><span class="num">${esc(fmt(r.v))}</span></div>`).join('')}</div>`}
function vbars(rows,fmt){const W=640,H=210,L=56,B=26,T=12;const mx=Math.max(1,...rows.map(r=>r.v));const step=niceStep(mx);const top=Math.ceil(mx/step)*step||1;
  const bw=(W-L-8)/rows.length;let g='';for(let y=0;y<=top;y+=step){const py=H-B-(y/top)*(H-B-T);g+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${py}" y2="${py}"/><text x="${L-6}" y="${py+4}" text-anchor="end">${esc(fmt(y))}</text>`}
  const bars=rows.map((r,i)=>{const h=(r.v/top)*(H-B-T);const x=L+i*bw+bw*.18;return`<rect class="bar${i===rows.length-1?' hi':''}" x="${x}" y="${H-B-h}" width="${bw*.64}" height="${Math.max(0,h)}" rx="2"><title>${esc(r.label)}: ${esc(brl(r.v))}</title></rect><text x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${esc(r.label)}</text>`}).join('');
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img">${g}${bars}</svg></div>`}
function niceStep(mx){const raw=mx/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}
const kfmt=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' mi':v>=1e3?Math.round(v/1e3)+' mil':String(Math.round(v));
function donut(rows){const tot=rows.reduce((s,r)=>s+r.v,0);if(!tot)return`<div class="empty small">Nenhuma proposta ainda.</div>`;const R=52,C=2*Math.PI*R;let off=0;
  const segs=rows.map(r=>{const len=r.v/tot*C;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${r.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return`<div class="row" style="gap:18px"><svg viewBox="0 0 140 140" width="140" height="140" role="img">${segs}<text x="70" y="68" text-anchor="middle" style="font-size:20px;fill:var(--ink)">${tot}</text><text x="70" y="86" text-anchor="middle">propostas</text></svg><div class="legend">${rows.map(r=>`<span><i style="background:${r.c}"></i>${esc(r.label)} <b class="num">${r.v}</b></span>`).join('')}</div></div>`}

function fatos(){ // eventos e itens normalizados para análise
  const ev=[],it=[];
  const ctx=(rec,origem)=>{const c=cadById(rec.clienteId);const uf=ufDe(c);return{cliente:cadNome(rec.clienteId)||'Sem cliente',perfil:c?.atividade||'Sem perfil',uf:uf||'Sem UF',regiao:REGIAO[uf]||'Sem região',cidade:cidadeDe(c)||'Sem cidade',vendedor:nomeUser(rec.vendedorId)||'Sem vendedor',status:rec.status||'',origem,servicos:[...new Set((rec.itens||[]).map(i=>i.servico||'Sem tipo'))]}};
  S.prop.forEach(p=>{const c=ctx(p,'Proposta');(p.timeline||[]).forEach(e=>ev.push({...c,data:(e.em||'').slice(0,10),tipo:e.tipo}));
    if(p.status==='Aprovada')(p.itens||[]).forEach(i=>it.push({...c,data:p.data,servico:i.servico||'Sem tipo',qtd:num(i.qtd||1),valor:num(i.qtd||0)*num(i.unit||0)}))});
  S.os.forEach(o=>{const c=ctx(o,'OS');(o.timeline||[]).forEach(e=>ev.push({...c,data:(e.em||'').slice(0,10),tipo:e.tipo}))});
  return{ev,it};
}
const GRUPOS=[['perfil','Perfil do cliente (atividade)'],['regiao','Região do país'],['uf','Estado'],['cidade','Cidade'],['mes','Mês'],['cliente','Cliente'],['servico','Tipo de serviço'],['vendedor','Vendedor'],['origem','Proposta ou OS']];
const PRESETS=[
  {n:'Alterações por perfil de cliente',m:'ev:Pedido de alteração',g:'perfil'},
  {n:'Alterações por região',m:'ev:Pedido de alteração',g:'regiao'},
  {n:'Alterações por mês',m:'ev:Pedido de alteração',g:'mes'},
  {n:'Serviços vendidos por região',m:'qtd',g:'regiao'},
  {n:'Valor vendido por tipo de serviço',m:'valor',g:'servico'},
  {n:'Spots comerciais por estado',m:'qtd',g:'uf',s:'Spot comercial'},
  {n:'Áudio para VT por região',m:'qtd',g:'regiao',s:'Áudio para VT'}];
function analise(){
  const A=S.f.an||(S.f.an={m:'ev:Pedido de alteração',g:'perfil',s:'',de:'',ate:''});
  const{ev,it}=fatos();const inP=d=>(!A.de||d>=A.de)&&(!A.ate||d<=A.ate);
  const agg={};const add=(k,v)=>{agg[k]=(agg[k]||0)+v};
  if(A.m.startsWith('ev:')){const t=A.m.slice(3);ev.filter(e=>(t==='*'||e.tipo===t)&&inP(e.data)).forEach(e=>{
      if(A.g==='servico'){const sv=A.s?e.servicos.filter(x=>x===A.s):e.servicos;sv.forEach(x=>add(x,1))}
      else{if(A.s&&!e.servicos.includes(A.s))return;add(A.g==='mes'?ymLabel(ym(e.data)):e[A.g],1)}})}
  else if(A.m==='prop'){S.prop.filter(p=>inP(p.data||'')).forEach(p=>{const c=cadById(p.clienteId);const uf=ufDe(c);const r={perfil:c?.atividade||'Sem perfil',uf:uf||'Sem UF',regiao:REGIAO[uf]||'Sem região',cidade:cidadeDe(c)||'Sem cidade',cliente:cadNome(p.clienteId)||'Sem cliente',vendedor:nomeUser(p.vendedorId)||'Sem vendedor',origem:'Proposta',mes:ymLabel(ym(p.data))};
      if(A.g==='servico'){[...new Set((p.itens||[]).map(i=>i.servico||'Sem tipo'))].filter(x=>!A.s||x===A.s).forEach(x=>add(x,1))}else{if(A.s&&!(p.itens||[]).some(i=>i.servico===A.s))return;add(r[A.g],1)}})}
  else{it.filter(i=>inP(i.data||'')&&(!A.s||i.servico===A.s)).forEach(i=>add(A.g==='mes'?ymLabel(ym(i.data)):i[A.g],A.m==='valor'?i.valor:i.qtd))}
  let rows=Object.entries(agg).map(([label,v])=>({label,v}));
  if(A.g==='mes'){const ord=k=>{const[m,y]=k.split('/');return y+String(MESES.indexOf(m)).padStart(2,'0')};rows.sort((a,b)=>ord(a.label).localeCompare(ord(b.label)))}else rows.sort((a,b)=>b.v-a.v);

function openOS(id){const o=id?S.os.find(x=>x.id===id):null;ED={kind:'os',draft:o?clone(o):novaOS(),isNew:!o};openDrawer()}
async function saveOS(silent){const d=ED.draft;d.total=totalItens(d.itens);d.atualizadoEm=nowIso();
  const ok=await put('os',d.id,d);if(!ok)return false;ED.isNew=false;
  if(d.status==='Faturada'||d.status==='Fechada'){if(finOK())await gerarReceber(d);else if(d.status==='Faturada')toast('OS salva. O título a receber é criado quando um administrador abrir o sistema.',4500)}
  if(!silent)toast(d.status==='Faturada'&&finOK()?'OS salva e título lançado no Contas a Receber.':'OS salva.');return true}
async function gerarReceber(o){const id='rec-'+o.id;if(S.lanc.some(l=>l.id===id))return;
  await put(P.lanc,id,{tipo:'receber',descricao:'OS '+o.numero+(o.titulo?' · '+o.titulo:''),cadastroId:o.clienteId,categoria:'Serviços prestados',valor:totalItens(o.itens),data:today(),vencimento:o.cobranca?.vencimento||addDays(today(),30),status:'aberto',osId:o.id,forma:o.cobranca?.forma||'',criadoEm:nowIso(),criadoPor:S.myId,exemplo:o.exemplo||undefined})}
let syncing=false;async function syncFaturadas(){if(!finOK()||syncing||!S.loaded.lanc||!S.loaded.os)return;syncing=true;try{for(const o of S.os.filter(o=>o.status==='Faturada'||o.status==='Fechada'))if(!S.lanc.some(l=>l.id==='rec-'+o.id))await gerarReceber(o)}finally{syncing=false}}

VIEWS.financeiro=()=>{
  if(!finOK())return emptyState('Área restrita','O financeiro é visível apenas para administradores.','');
  const tab=S.f.finT||'receber';
  const tabs=`<div class="seg">${[['receber','Contas a receber'],['pagar','Contas a pagar'],['fluxo','Fluxo de caixa'],['dre','DRE simplificado']].map(([v,l])=>`<button data-act="finT" data-v="${v}" aria-pressed="${tab===v}">${l}</button>`).join('')}</div>`;
  let body='';
  if(tab==='receber'||tab==='pagar'){
    const st=S.f.finS||'aberto';const q=norm(S.f.finQ||'');const mes=S.f.finM||'';
    const all=S.lanc.filter(l=>l.tipo===tab);
    const rows=all.filter(l=>{const venc=l.status!=='pago'&&l.vencimento&&l.vencimento<today();return(st==='todos'||(st==='vencido'?venc:l.status===st))&&(!mes||ym(l.vencimento)===mes)&&(!q||norm(l.descricao+' '+cadNome(l.cadastroId)+' '+l.categoria).includes(q))}).sort((a,b)=>(a.vencimento||'').localeCompare(b.vencimento||''));
    const sum=rows.reduce((s,l)=>s+num(l.valor),0);
    body=`<div class="row"><div class="seg">${[['aberto','Em aberto'],['vencido','Vencidos'],['pago',tab==='receber'?'Recebidos':'Pagos'],['todos','Todos']].map(([v,l])=>`<button data-act="finS" data-v="${v}" aria-pressed="${st===v}">${l}</button>`).join('')}</div>
      <input class="in" type="month" id="finM" value="${mes}" style="max-width:170px" aria-label="Mês de vencimento"><input class="in search" id="finQ" placeholder="Buscar" value="${esc(S.f.finQ||'')}"><span class="sp" style="flex:1"></span><button class="btn" data-act="exportar" data-what="lanc">Exportar</button><button class="btn pri" data-act="newLanc" data-t="${tab}">${tab==='receber'?'Nova receita':'Nova despesa'}</button></div>
    ${!all.length?emptyState(tab==='receber'?'Nenhuma conta a receber':'Nenhuma conta a pagar',tab==='receber'?'Os títulos aparecem aqui quando uma OS é faturada, ou lance manualmente.':'Lance contas fixas como aluguel e luz, ou pagamentos a fornecedores pelas OS.',''):
    `<div class="tbl-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>${tab==='receber'?'Cliente':'Fornecedor'}</th><th>Categoria</th><th>Status</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${rows.map(l=>{const venc=l.status!=='pago'&&l.vencimento&&l.vencimento<today();return`<tr data-act="openLanc" data-id="${l.id}"><td class="mono small" style="${venc?'color:var(--bad)':''}">${fdate(l.vencimento)}</td><td>${esc(l.descricao)}${exTag(l)}${l.osId?' '+pill('OS','p-acc'):''}</td><td>${esc(cadNome(l.cadastroId))}</td><td class="small">${esc(l.categoria||'')}</td><td>${l.status==='pago'?pill(tab==='receber'?'Recebido':'Pago','p-ok'):venc?pill('Vencido','p-bad'):pill('Aberto','p-warn')}</td><td class="r num">${brl(l.valor)}</td><td>${l.status!=='pago'?`<button class="btn sm" data-act="baixa" data-id="${l.id}">Dar baixa</button>`:''}</td></tr>`}).join('')}
    </tbody></table></div><p class="small">Total listado: <b class="num">${brl(sum)}</b> em ${rows.length} lançamentos</p>`}`;
  }else if(tab==='fluxo'){
    const ano=S.f.finY||today().slice(0,4);const ms=Array.from({length:12},(_,i)=>ano+'-'+String(i+1).padStart(2,'0'));
    let acc=0;const linhas=ms.map(k=>{const ent=S.lanc.filter(l=>l.tipo==='receber'&&l.status==='pago'&&ym(l.pagoEm||l.vencimento)===k).reduce((s,l)=>s+num(l.valor),0);const sai=S.lanc.filter(l=>l.tipo==='pagar'&&l.status==='pago'&&ym(l.pagoEm||l.vencimento)===k).reduce((s,l)=>s+num(l.valor),0);
      const pe=S.lanc.filter(l=>l.tipo==='receber'&&l.status!=='pago'&&ym(l.vencimento)===k).reduce((s,l)=>s+num(l.valor),0);const ps=S.lanc.filter(l=>l.tipo==='pagar'&&l.status!=='pago'&&ym(l.vencimento)===k).reduce((s,l)=>s+num(l.valor),0);acc+=ent-sai;return{k,ent,sai,pe,ps,acc}});
    body=`<div class="row"><label class="f" style="max-width:140px"><span>Ano</span><input class="in" id="finY" type="number" value="${ano}"></label></div>
    <div class="card"><h3>Saldo realizado por mês</h3>${vbars(linhas.map(l=>({label:ymLabel(l.k),v:Math.max(0,l.ent-l.sai)})),kfmt)}<p class="small muted" style="margin:6px 0 0">Mostra meses com saldo positivo. A tabela abaixo traz entradas, saídas e o previsto.</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Mês</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Saldo do mês</th><th class="r">Acumulado</th><th class="r">A receber previsto</th><th class="r">A pagar previsto</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${ymLabel(l.k)}</td><td class="r num">${brl(l.ent)}</td><td class="r num">${brl(l.sai)}</td><td class="r num" style="color:${l.ent-l.sai>=0?'var(--ok)':'var(--bad)'}">${brl(l.ent-l.sai)}</td><td class="r num">${brl(l.acc)}</td><td class="r num muted">${brl(l.pe)}</td><td class="r num muted">${brl(l.ps)}</td></tr>`).join('')}</tbody></table></div>`;
  }else{
    const ano=S.f.finY||today().slice(0,4);const L=S.lanc.filter(l=>(l.data||'').startsWith(ano));
    const rec=L.filter(l=>l.tipo==='receber').reduce((s,l)=>s+num(l.valor),0);const cats={};L.filter(l=>l.tipo==='pagar').forEach(l=>{const c=l.categoria||'Sem categoria';cats[c]=(cats[c]||0)+num(l.valor)});
    const desp=Object.values(cats).reduce((a,b)=>a+b,0);const res=rec-desp;
    body=`<div class="row"><label class="f" style="max-width:140px"><span>Ano</span><input class="in" id="finY" type="number" value="${ano}"></label><p class="small muted" style="margin:0">Pela data de competência dos lançamentos.</p></div>
    <div class="grid g4"><div class="card kpi"><div class="label">Receitas</div><div class="v">${brl(rec)}</div></div><div class="card kpi"><div class="label">Despesas</div><div class="v">${brl(desp)}</div></div><div class="card kpi"><div class="label">Resultado</div><div class="v" style="color:${res>=0?'var(--ok)':'var(--bad)'}">${brl(res)}</div><div class="s">Margem ${rec?(res/rec*100).toFixed(1).replace('.',','):'0'}%</div></div></div>
    <div class="tbl-wrap"><table><tbody>
      <tr><td><b>Receita bruta</b></td><td class="r num"><b>${brl(rec)}</b></td></tr>
      ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td style="padding-left:24px">(−) ${esc(c)}</td><td class="r num">${brl(v)}</td></tr>`).join('')}
      <tr><td><b>Total de despesas</b></td><td class="r num"><b>${brl(desp)}</b></td></tr>
      <tr><td><b>Resultado do período</b></td><td class="r num"><b style="color:${res>=0?'var(--ok)':'var(--bad)'}">${brl(res)}</b></td></tr></tbody></table></div>`;
  }
  return`<div class="head"><div><h1>Financeiro</h1><p>Contas a receber, contas a pagar, fluxo de caixa e resultado.</p></div></div>${tabs}${body}`;
};

async function saveLanc(){const d=ED.draft;d.valor=num(d.valor);if(d.status==='pago'&&!d.pagoEm)d.pagoEm=today();if(d.status!=='pago')d.pagoEm='';
  const n=ED.isNew?Math.max(1,Math.min(36,parseInt(d.repetir)||1)):1;delete d.repetir;
  for(let i=0;i<n;i++){const x=clone(d);if(i>0){x.id=uid();x.data=addMonths(d.data,i);x.vencimento=addMonths(d.vencimento,i);x.status='aberto';x.pagoEm='';x.descricao=d.descricao+` (${i+1}/${n})`}else if(n>1)x.descricao=d.descricao+` (1/${n})`;
    if(!await put(P.lanc,x.id,x))return}

function parseXML(text){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.querySelector('parsererror'))throw new Error('xml');
  const cnt=new Map();doc.querySelectorAll('*').forEach(el=>{if(el.children.length){const p=el.parentElement;if(!p)return;const k=p.tagName+'>'+el.tagName;cnt.set(k,(cnt.get(k)||0)+1)}});
  let best=null,bn=0;cnt.forEach((n,k)=>{if(n>bn){bn=n;best=k}});if(!best)return[];const tag=best.split('>')[1];
  return[...doc.getElementsByTagName(tag)].map(el=>{const r={};[...el.attributes].forEach(a=>r[a.name]=a.value);const walk=(e,pre)=>{[...e.children].forEach(c=>{const k=pre?pre+'.'+c.tagName:c.tagName;if(c.children.length)walk(c,k);else r[k]=c.textContent.trim()})};walk(el,'');return r})}
function autoMap(alvo,cols){const m={};const nc=cols.map(c=>[c,norm(c).replace(/[_.]/g,' ')]);ALVOS[alvo].campos.forEach(([k])=>{const sin=SINON[k]||[];let hit=nc.find(([,n])=>sin.includes(n));if(!hit)hit=nc.find(([,n])=>sin.some(s=>s.length>3&&n.includes(s)));if(hit&&!Object.values(m).includes(hit[0]))m[k]=hit[0]});return m}
function guessAlvo(cols){const n=cols.map(norm).join(' ');if(/vencimento|baixa|pagamento|plano de contas/.test(n))return'lanc';if(/ordem|os\b/.test(n))return'os';if(/orcamento|proposta|validade/.test(n))return'prop';return'cad'}
async function onImportFile(file){try{let sheets={},names=[];
  if(/\.xml$/i.test(file.name)){const t=await file.text();let rows=null;if(/urn:schemas-microsoft-com:office:spreadsheet/.test(t)&&window.XLSX){const wb=XLSX.read(t,{type:'string',cellDates:true});wb.SheetNames.forEach(s=>{sheets[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:'',raw:false})});names=wb.SheetNames}else{rows=parseXML(t);sheets={XML:rows};names=['XML']}}
  else{if(!window.XLSX){toast('O leitor de planilhas não carregou. Recarregue a página.');return}const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});wb.SheetNames.forEach(s=>{sheets[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:'',raw:true})});names=wb.SheetNames}
  const sheet=names.find(n=>sheets[n].length)||names[0];setImpSheet({file:file.name,all:sheets,sheets:names,papel:'Cliente',tipoPad:'pagar'},sheet)}catch(e){toast('Não consegui ler este arquivo. Tente exportar do GMPE em Excel ou CSV.')}}
function setImpSheet(I,sheet){I.sheet=sheet;I.rows=I.all[sheet]||[];const cs=new Set();I.rows.slice(0,200).forEach(r=>Object.keys(r).forEach(k=>cs.add(k)));I.cols=[...cs];I.alvo=I.alvo||guessAlvo(I.cols);I.map=autoMap(I.alvo,I.cols);I.done='';S.imp=I;render()}
document.addEventListener('change',e=>{const t=e.target;if(!S.imp)return;if(t.id==='imp_sheet')setImpSheet(S.imp,t.value);else if(t.id==='imp_alvo'){S.imp.alvo=t.value;S.imp.map=autoMap(t.value,S.imp.cols);render()}else if(t.id==='imp_papel'){S.imp.papel=t.value}else if(t.id==='imp_tipo'){S.imp.tipoPad=t.value}else if(t.dataset.map){S.imp.map[t.dataset.map]=t.value;render()}});
function toISO(v){if(v==null||v==='')return'';if(v instanceof Date&&!isNaN(v))return new Date(v-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return''}
function findCad(nome,papelPref){const n=norm(nome);if(!n)return'';const c=S.cad.find(c=>norm(c.nome)===n||norm(c.razaoSocial)===n)||S.cad.find(c=>n.length>4&&(norm(c.nome).includes(n)||norm(c.razaoSocial).includes(n)));return c?c.id:''}
function mapStatus(v,list,def){const n=norm(v);if(!n)return def;const hit=list.find(s=>norm(s)===n)||list.find(s=>n.includes(norm(s).split(' ')[0]));if(hit)return hit;if(/aprov|fech|ganh/.test(n))return list.includes('Aprovada')?'Aprovada':'Fechada';if(/cancel|perd|recus|reprov/.test(n))return list.includes('Não Aprovada')?'Não Aprovada':'Fechada';if(/fatur/.test(n))return'Faturada';if(/exec|andam|produ/.test(n))return'Em Execução';return def}
async function runImport(){const I=S.imp;if(!I||I.running)return;I.running=true;I.prog=0;render();const g=(r,k)=>I.map[k]?r[I.map[k]]:'';let ok=0,skip=0,fail=0;
  const docs=new Set(S.cad.map(c=>digits(c.doc)).filter(d=>d.length>=11));const yearNums={};
  for(const r of I.rows){I.prog++;if(I.prog%10===0){const b=$('[data-act="impRun"]');if(b)b.textContent=`Importando… ${I.prog} de ${I.rows.length}`}
    try{
    if(I.alvo==='cad'){const doc=String(g(r,'doc')||'');const dd=digits(doc);if(dd.length>=11&&docs.has(dd)){skip++;continue}if(!g(r,'nome')&&!g(r,'razaoSocial')){skip++;continue}
      const c=novoCad();c.tipo=dd.length===11?'PF':'PJ';const pv=norm(g(r,'papel'));c.papel=/fornec/.test(pv)&&/client/.test(pv)?'Ambos':/fornec/.test(pv)?'Fornecedor':/client/.test(pv)?'Cliente':I.papel;
      Object.assign(c,{nome:String(g(r,'nome')||g(r,'razaoSocial')).trim(),razaoSocial:String(g(r,'razaoSocial')||'').trim(),doc,atividade:String(g(r,'atividade')||''),telefone:String(g(r,'telefone')||''),celular:String(g(r,'celular')||''),email:String(g(r,'email')||''),ie:String(g(r,'ie')||''),im:String(g(r,'im')||''),site:String(g(r,'site')||''),instagram:String(g(r,'instagram')||''),linkedin:String(g(r,'linkedin')||''),portfolio:String(g(r,'portfolio')||''),obs:String(g(r,'obs')||''),importadoGMPE:true});
      const uf=String(g(r,'uf')||'').toUpperCase().trim();Object.assign(c.endereco,{cep:String(g(r,'cep')||''),rua:String(g(r,'rua')||''),numero:String(g(r,'numero')||''),complemento:String(g(r,'complemento')||''),bairro:String(g(r,'bairro')||''),cidade:String(g(r,'cidade')||''),uf:UFS.includes(uf)?uf:''});
      if(c.tipo==='PF')c.natUf=c.endereco.uf;
      if(g(r,'contatoNome'))c.contatos=[{nome:String(g(r,'contatoNome')),cargo:String(g(r,'contatoCargo')||''),telefone:'',email:'',linkedin:''}];
      if(await put('cadastros',c.id,c,'importar')){ok++;if(dd.length>=11)docs.add(dd);}else fail++}
    else if(I.alvo==='lanc'){const tv=norm(g(r,'tipo'));const tipo=/receb|receita|entrada|credito/.test(tv)?'receber':/pag|despesa|saida|debito/.test(tv)?'pagar':I.tipoPad;const pagoEm=toISO(g(r,'pagoEm'));const sv=norm(g(r,'status'));
      const l={id:uid(),tipo,descricao:String(g(r,'descricao')||''),cadastroId:findCad(g(r,'pessoa')),categoria:String(g(r,'categoria')||''),valor:Math.abs(num(g(r,'valor'))),data:toISO(g(r,'data'))||toISO(g(r,'vencimento'))||today(),vencimento:toISO(g(r,'vencimento'))||toISO(g(r,'data'))||today(),status:(pagoEm||/pago|receb|quit|baix|liquid/.test(sv))?'pago':'aberto',pagoEm,forma:String(g(r,'forma')||''),obs:g(r,'pessoa')&&!findCad(g(r,'pessoa'))?'Pessoa no GMPE: '+g(r,'pessoa'):'',importadoGMPE:true,criadoEm:nowIso(),criadoPor:S.myId};
      if(l.status==='pago'&&!l.pagoEm)l.pagoEm=l.vencimento;if(!l.valor&&!l.descricao){skip++;continue}
      if(await put(P.lanc,l.id,l,'importar'))ok++;else fail++}
    else{const isOS=I.alvo==='os';const cli=findCad(g(r,'cliente'));const data=toISO(g(r,'data'))||today();const valor=num(g(r,'valor'));
      const base=isOS?novaOS():novaProp();Object.assign(base,{clienteId:cli,titulo:String(g(r,'titulo')||''),data,itens:[{servico:String(g(r,'servico')||''),descricao:String(g(r,'titulo')||''),qtd:1,unit:valor}],importadoGMPE:true,vendedorId:null});
      const nr=String(g(r,'numero')||'').trim();base.numero=nr?(isOS?'OS-':'')+'GMPE-'+nr:base.numero+'-'+I.prog;
      if(!cli&&g(r,'cliente'))base.titulo=(base.titulo?base.titulo+' · ':'')+'Cliente no GMPE: '+g(r,'cliente');
      if(isOS){base.status=mapStatus(g(r,'status'),ST_OS,'Fechada');base.notas=String(g(r,'notas')||'');if(await put('os',base.id,base,'importar'))ok++;else fail++}
      else{base.status=mapStatus(g(r,'status'),ST_PROP,'Apresentada');base.validade=toISO(g(r,'validade'))||addDays(data,15);base.condicoes=String(g(r,'condicoes')||'');if(await put('propostas',base.id,base,'importar'))ok++;else fail++}}
    }catch(e){fail++}
    if(fail>5&&ok===0)break;}
  I.running=false;I.done=`${ok} registros importados${skip?`, ${skip} pulados (duplicados ou vazios)`:''}${fail?`, ${fail} com erro`:''}.`;render()}

  if(what==='os'){nome='ordens-de-servico';rows=S.os.map(o=>({'Número':o.numero,'Data':o.data,'Cliente':cadNome(o.clienteId),'Título':o.titulo,'Status':o.status,'Responsáveis':(o.responsaveis||[]).join('; '),'Valor':totalItens(o.itens),...(finOK()?{'Custos':despesa().filter(l=>l.osId===o.id).reduce((s,l)=>s+num(l.valor),0)}:{})}))}
  if(what==='lanc'){nome='lancamentos';rows=S.lanc.map(l=>({'Tipo':l.tipo==='receber'?'Receber':'Pagar','Descrição':l.descricao,'Cliente/Fornecedor':cadNome(l.cadastroId),'Categoria':l.categoria,'Valor':num(l.valor),'Competência':l.data,'Vencimento':l.vencimento,'Situação':l.status==='pago'?'Pago':'Aberto','Pago em':l.pagoEm,'Forma':l.forma}))}
  if(!rows.length){toast('Nada para exportar ainda.');return}
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,nome.slice(0,30));const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  saveBlob(`${nome}-${today()}.xlsx`,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast('Planilha baixada.')}

  toast('Enviando '+file.name+'…',60000);const{error}=await SB.storage.from(bucket).upload(path,file,{contentType:file.type||undefined,upsert:false});

async function criarExemplos(){if(!DB)return;toast('Criando exemplos…',15000);const y=+today().slice(0,4);const mk=(o)=>({...o,exemplo:true});
  const cads=[
   mk({...novoCad(),nome:'Agência Exemplo Sul',razaoSocial:'Agência Exemplo Sul Ltda',tipo:'PJ',papel:'Cliente',atividade:'Agência de Publicidade',doc:'00.000.000/0001-01',email:'contato@exemplo.com',endereco:{cidade:'Curitiba',uf:'PR'},contatos:[{nome:'Marina (exemplo)',cargo:'RTV'}]}),
   mk({...novoCad(),nome:'Supermercado Exemplo',tipo:'PJ',papel:'Cliente',atividade:'Cliente direto (anunciante)',doc:'00.000.000/0001-02',endereco:{cidade:'Recife',uf:'PE'}}),
   mk({...novoCad(),nome:'Produtora Exemplo Filmes',tipo:'PJ',papel:'Cliente',atividade:'Produtora de Vídeo',doc:'00.000.000/0001-03',endereco:{cidade:'São Paulo',uf:'SP'}}),
   mk({...novoCad(),nome:'Agência Exemplo Norte',tipo:'PJ',papel:'Cliente',atividade:'Agência de Publicidade',doc:'00.000.000/0001-04',endereco:{cidade:'Belém',uf:'PA'}}),
   mk({...novoCad(),nome:'Locutor Exemplo',tipo:'PF',papel:'Fornecedor',atividade:'Locutor',doc:'000.000.000-01',natCidade:'Porto Alegre',natUf:'RS',portfolio:'https://exemplo.com'}),
   mk({...novoCad(),nome:'Músico Exemplo',tipo:'PF',papel:'Fornecedor',atividade:'Músico',doc:'000.000.000-02',natCidade:'Salvador',natUf:'BA'})];
  for(const c of cads){c.id='ex-'+uid();await put('cadastros',c.id,c)}
  const sv=S.listas.tiposServico;const st=['Aprovada','Aprovada','Apresentada','Não Aprovada','Standby','Aprovada','Aprovada','Apresentada'];const props=[];
  for(let i=0;i<8;i++){const d=new Date();d.setMonth(d.getMonth()-(i%6));const data=d.toISOString().slice(0,10);const c=cads[i%4];
    const tl=[{id:uid(),em:new Date(data+'T14:00:00').toISOString(),por:S.myId,tipo:'Follow-up',texto:'Cliente recebeu a proposta'}];if(i%2===0)tl.push({id:uid(),em:new Date(data+'T16:30:00').toISOString(),por:S.myId,tipo:'Pedido de alteração',texto:'Trocar a trilha e ajustar o texto final'});if(i%3===0)tl.push({id:uid(),em:new Date(data+'T17:30:00').toISOString(),por:S.myId,tipo:'Pedido de alteração',texto:'Nova locução com outro tom'});
    const p=mk({...novaProp(),id:'ex-'+uid(),numero:`${y}-9${String(i+1).padStart(2,'0')}`,data,validade:addDays(data,15),clienteId:c.id,titulo:['Campanha de verão','Promoção de aniversário','Lançamento de produto','Institucional'][i%4],status:st[i],itens:[{servico:sv[i%3],descricao:'Peça de 30 segundos',qtd:1+(i%3),unit:900+i*150},{servico:sv[3],descricao:'Locução',qtd:1,unit:600}],timeline:tl});
    props.push(p);await put('propostas',p.id,p)}
  const oss=[];for(const [i,p] of props.filter(p=>p.status==='Aprovada').entries()){const o=mk({...novaOS(p),id:'ex-'+uid(),numero:`OS-${y}-9${String(i+1).padStart(2,'0')}`,status:['Faturada','Em Execução','Fechada','Esperando Faturar'][i%4],responsaveis:[],data:p.data});oss.push(o);await put('os',o.id,o);await patch('propostas',p.id,{osId:o.id})}
  if(finOK()){for(const o of oss)if(o.status==='Faturada'||o.status==='Fechada')await put(P.lanc,'rec-'+o.id,{tipo:'receber',descricao:'OS '+o.numero,cadastroId:o.clienteId,categoria:'Serviços prestados',valor:totalItens(o.itens),data:o.data,vencimento:addDays(o.data,30),status:o.status==='Fechada'?'pago':'aberto',pagoEm:o.status==='Fechada'?addDays(o.data,28):'',osId:o.id,exemplo:true});
    for(let m=0;m<4;m++){const d=addMonths(today(),-m).slice(0,8)+'05';await put(P.lanc,'ex-'+uid(),{tipo:'pagar',descricao:'Aluguel do estúdio (exemplo)',categoria:'Aluguel',valor:3500,data:d,vencimento:d,status:m?'pago':'aberto',pagoEm:m?d:'',exemplo:true});await put(P.lanc,'ex-'+uid(),{tipo:'pagar',descricao:'Energia (exemplo)',categoria:'Energia',valor:420+m*30,data:d,vencimento:addDays(d,5),status:m?'pago':'aberto',pagoEm:m?addDays(d,5):'',exemplo:true})}
    if(oss[0])await put(P.lanc,'ex-'+uid(),{tipo:'pagar',descricao:'Cachê de locução',cadastroId:cads[4].id,categoria:'Fornecedor de produção',valor:450,data:oss[0].data,vencimento:addDays(oss[0].data,10),status:'aberto',osId:oss[0].id,exemplo:true})}
  toast('Exemplos criados. Veja o Painel e o CRM.',5000)}
async function apagarExemplos(){if(!DB)return;toast('Apagando exemplos…',15000);let n=0;
  for(const[col,list]of[['propostas',S.prop],['os',S.os],['cadastros',S.cad],[P.lanc,S.lanc]])for(const x of list.filter(x=>x.exemplo))if(await del(col,x.id))n++;toast(n+' registros de exemplo apagados.')}

/* ================= inicialização (Supabase) ================= */
function renderEdSoft(){if(!ED)return;const a=document.activeElement;if(a&&dr.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(ED.kind==='os')renderEd()}
function refreshNames(){}
function authShell(inner){$('#nav').innerHTML='';$('#me').innerHTML='';const lg=S.cfg.logo?`<img src="${esc(imgUrl(S.cfg.logo))}" alt="">`:'<span class="mark">MRG</span>';$('#brand').innerHTML=lg+'<b>Sistema MRG</b>';
  $('#main').innerHTML=`<div class="auth"><div class="card">${inner}</div></div>`}
function showSetup(){authShell(`<h2>Falta configurar o banco de dados</h2><p class="muted">Abra o arquivo index.html e preencha SUPA_URL e SUPA_KEY com os dados do projeto no Supabase.</p>`)}
function showLogin(modo='entrar',msg=''){S.authModo=modo;
  const tabs=`<div class="seg" style="margin-bottom:16px"><button data-auth="entrar" aria-pressed="${modo==='entrar'}">Entrar</button><button data-auth="criar" aria-pressed="${modo==='criar'}">Criar conta</button></div>`;
  let f='';
  if(modo==='entrar')f=`<form id="authForm" class="grid" style="gap:12px"><label class="f"><span>E-mail</span><input class="in" id="au_email" type="email" autocomplete="email" required></label><label class="f"><span>Senha</span><input class="in" id="au_senha" type="password" autocomplete="current-password" required></label><button class="btn pri" type="submit">Entrar</button><a href="#" data-auth="esqueci" class="small">Esqueci minha senha</a></form>`;
  if(modo==='criar')f=`<form id="authForm" class="grid" style="gap:12px"><label class="f"><span>Seu nome</span><input class="in" id="au_nome" autocomplete="name" required></label><label class="f"><span>E-mail</span><input class="in" id="au_email" type="email" autocomplete="email" required></label><label class="f"><span>Senha (mínimo 8 caracteres)</span><input class="in" id="au_senha" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn pri" type="submit">Criar conta</button><p class="small muted" style="margin:0">Depois de criar a conta, um administrador precisa liberar o seu acesso.</p></form>`;
  if(modo==='esqueci')f=`<form id="authForm" class="grid" style="gap:12px"><label class="f"><span>E-mail da sua conta</span><input class="in" id="au_email" type="email" autocomplete="email" required></label><button class="btn pri" type="submit">Enviar link para nova senha</button><a href="#" data-auth="entrar" class="small">Voltar para o login</a></form>`;
  if(modo==='nova')f=`<form id="authForm" class="grid" style="gap:12px"><label class="f"><span>Nova senha (mínimo 8 caracteres)</span><input class="in" id="au_senha" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn pri" type="submit">Salvar nova senha</button></form>`;
  authShell(`<h2 style="margin-bottom:6px">${modo==='nova'?'Criar nova senha':modo==='esqueci'?'Recuperar senha':'Acesse o sistema'}</h2><p class="muted small" style="margin:0 0 16px">Sistema de gestão da MRG</p>${modo==='entrar'||modo==='criar'?tabs:''}${msg?`<div class="banner" style="margin-bottom:12px">${esc(msg)}</div>`:''}${f}`)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-auth]');if(!a)return;e.preventDefault();showLogin(a.dataset.auth)});
document.addEventListener('submit',async e=>{if(e.target.id!=='authForm')return;e.preventDefault();const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;const v=id=>($('#'+id)?.value||'').trim();const modo=S.authModo;const back=location.origin+location.pathname;
  try{
    if(modo==='entrar'){const{data,error}=await SB.auth.signInWithPassword({email:v('au_email'),password:$('#au_senha').value});if(error){showLogin('entrar',/confirm/i.test(error.message)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':'E-mail ou senha incorretos.');return}await start(data.user)}
    if(modo==='criar'){const{data,error}=await SB.auth.signUp({email:v('au_email'),password:$('#au_senha').value,options:{data:{nome:v('au_nome')},emailRedirectTo:back}});if(error){showLogin('criar',/registered|exists/i.test(error.message)?'Este e-mail já tem conta. Use Entrar.':/password/i.test(error.message)?'Senha fraca. Use pelo menos 8 caracteres.':'Não foi possível criar a conta: '+error.message);return}
      if(data.session)await start(data.user);else showLogin('entrar','Conta criada. Enviamos um e-mail de confirmação: clique no link e depois entre aqui.')}
    if(modo==='esqueci'){const{error}=await SB.auth.resetPasswordForEmail(v('au_email'),{redirectTo:back});showLogin('entrar',error?'Não foi possível enviar o e-mail. Confira o endereço.':'Se o e-mail tiver conta, enviamos um link para criar uma nova senha.')}
    if(modo==='nova'){const{error}=await SB.auth.updateUser({password:$('#au_senha').value});if(error){showLogin('nova','Não foi possível salvar: '+error.message);return}const{data}=await SB.auth.getUser();toast('Senha alterada.');await start(data.user)}
  }finally{btn.disabled=false}});
function showPending(){authShell(`<h2 style="margin-bottom:8px">Aguardando liberação</h2><p class="muted">Sua conta foi criada. Um administrador precisa liberar o seu acesso em Configurações. Assim que isso acontecer, esta tela abre o sistema sozinha.</p><div class="row"><button class="btn" data-act="sair">Sair</button></div>`)}
async function loadPerfis(){const{data,error}=await SB.from('perfis').select('*').order('criado_em');if(error){toast('Erro ao carregar usuários.');return}S.perfis=data||[];S.names={};S.perfis.forEach(p=>S.names[p.id]=p.nome||p.email);S.meP=S.perfis.find(p=>p.id===S.myId)||null;S.isAdmin=!!(S.meP&&S.meP.ativo&&S.meP.papel==='admin')}
let started=false;
async function start(user){S.myId=user.id;S.email=user.email;await loadPerfis();
  if(!S.meP||!S.meP.ativo){showPending();if(!S.pendCh)S.pendCh=SB.channel('pend').on('postgres_changes',{event:'UPDATE',schema:'public',table:'perfis',filter:'id=eq.'+user.id},()=>location.reload()).subscribe();return}
  if(started)return;started=true;S.booted=true;DB=SB;ASSETS=true;render();
  await loadAll();S.loaded.lanc=S.loaded.os=true;render();syncFaturadas();
  SB.channel('mrg').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{if(p.eventType==='DELETE'){if(p.old&&p.old.colecao)removeLocal(p.old.colecao,p.old.id)}else applyLocal(p.new.colecao,p.new.id,p.new.data)})
    .on('postgres_changes',{event:'*',schema:'public',table:'perfis'},async()=>{const was=S.isAdmin;await loadPerfis();if(!S.meP?.ativo||was!==S.isAdmin)location.reload();else queueRender()}).subscribe();
  SB.rpc('marcar_visto').then(()=>{})}
async function loadAll(){let from=0;const size=1000;S.quiet=true;try{for(;;){const{data,error}=await SB.from('docs').select('colecao,id,data').range(from,from+size-1);if(error){toast('Erro ao carregar os dados.');break}data.forEach(r=>applyLocal(r.colecao,r.id,r.data));if(data.length<size)break;from+=size}}finally{S.quiet=false}}
async function boot(){
  try{S.view=(location.hash||'').replace('#','')||'painel'}catch{}
  if(!window.supabase||/^COLE/.test(SUPA_URL)){showSetup();return}
  const rec=/type=recovery/.test(location.hash);
  SB=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  SB.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;showLogin('nova')}if(ev==='SIGNED_OUT')location.reload()});
  const{data:{session}}=await SB.auth.getSession();
  if(rec||S.recovery){if(!S.recovery)showLogin('nova');return}
  if(/access_token|type=signup/.test(location.hash))try{history.replaceState(null,'',location.pathname)}catch{}
  if(!session){showLogin();return}
  await start(session.user)}

boot();
</script>
